<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>はっぴょうメーカー</title>
<style>
  :root{
    --orange:#FF9800; --green:#4CAF50; --blue:#2196F3; --purple:#9C27B0;
    --pink:#E91E63; --teal:#009688; --red:#F44336;
    --bg:#FFF3E0;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","BIZ UDGothic","Yu Gothic",sans-serif;
    background:var(--bg); display:flex; flex-direction:column; overflow:hidden;
    touch-action:manipulation;
  }
  button{ font-family:inherit; cursor:pointer; border:none; }

  /* ===== トップバー ===== */
  #topbar{
    display:flex; align-items:center; gap:8px; padding:8px 12px;
    background:linear-gradient(90deg,#FFB74D,#FFD54F); box-shadow:0 2px 6px rgba(0,0,0,.15);
    flex-wrap:wrap; z-index:20;
  }
  #topbar h1{ font-size:20px; margin:0 8px 0 0; color:#5D4037; white-space:nowrap; }
  .tbtn{
    font-size:15px; font-weight:bold; padding:9px 14px; border-radius:12px;
    background:#fff; color:#5D4037; box-shadow:0 2px 0 rgba(0,0,0,.15);
  }
  .tbtn:active{ transform:translateY(2px); box-shadow:none; }
  .tbtn.primary{ background:var(--red); color:#fff; font-size:16px; }
  #topbar .spacer{ flex:1; }

  /* ===== レイアウト ===== */
  #main{ flex:1; display:flex; min-height:0; }

  /* スライドいちらん */
  #sidebar{
    width:180px; background:#FFF8E1; border-right:3px solid #FFE0B2;
    display:flex; flex-direction:column; padding:8px; gap:8px; overflow-y:auto;
  }
  .thumb{
    position:relative; border:3px solid #FFCC80; border-radius:10px; background:#fff;
    cursor:pointer; flex-shrink:0; overflow:hidden;
  }
  .thumb.sel{ border-color:var(--red); box-shadow:0 0 0 3px rgba(244,67,54,.3); }
  .thumb .tstage{ width:150px; height:84px; overflow:hidden; position:relative; pointer-events:none; }
  .thumb .tnum{
    position:absolute; top:2px; left:2px; background:rgba(93,64,55,.8); color:#fff;
    font-size:11px; font-weight:bold; border-radius:8px; padding:1px 7px; z-index:5;
  }
  .thumb .tctrl{ display:flex; justify-content:space-around; background:#FFF3E0; padding:2px; }
  .thumb .tctrl button{ background:none; font-size:15px; padding:2px 6px; border-radius:6px; }
  .thumb .tctrl button:active{ background:#FFE0B2; }
  #addSlideBtn{
    flex-shrink:0; font-size:15px; font-weight:bold; padding:12px 6px; border-radius:12px;
    background:var(--green); color:#fff; box-shadow:0 3px 0 #388E3C;
  }
  #addSlideBtn:active{ transform:translateY(3px); box-shadow:none; }

  /* へんしゅうエリア */
  #editArea{ flex:1; display:flex; flex-direction:column; min-width:0; }
  #toolbar{
    display:flex; align-items:center; gap:10px; padding:8px 12px; flex-wrap:wrap;
    background:#FFECB3; border-bottom:2px solid #FFE082; min-height:52px;
  }
  .toolLabel{ font-size:13px; font-weight:bold; color:#795548; }
  .swatch{
    width:32px; height:32px; border-radius:50%; border:3px solid #fff;
    box-shadow:0 1px 3px rgba(0,0,0,.3); padding:0;
  }
  .swatch.sel{ border-color:var(--red); }
  .toolbtn{
    font-size:14px; font-weight:bold; padding:8px 12px; border-radius:10px;
    background:#fff; color:#5D4037; box-shadow:0 2px 0 rgba(0,0,0,.12);
  }
  .toolbtn:active{ transform:translateY(2px); box-shadow:none; }
  .toolbtn.mic.rec{ background:var(--red); color:#fff; animation:pulse 1s infinite; }
  @keyframes pulse{ 50%{ opacity:.6; } }
  #stampTools{ display:none; align-items:center; gap:6px; background:#FFF9C4; border-radius:10px; padding:4px 8px; }
  #stampTools.show{ display:flex; }

  #stage{ flex:1; display:flex; align-items:center; justify-content:center; min-height:0; padding:14px; }
  #slideHolder{ position:relative; box-shadow:0 6px 24px rgba(0,0,0,.25); border-radius:8px; }

  /* ===== スライド本体(960x540こてい) ===== */
  .slide{
    width:960px; height:540px; position:absolute; top:0; left:0;
    transform-origin:top left; overflow:hidden; border-radius:8px;
  }
  .box{ position:absolute; }
  .tx{
    white-space:pre-wrap; word-break:break-word; outline:none; border-radius:14px;
    line-height:1.45; overflow:hidden;
  }
  .slide.editable .tx{ border:3px dashed rgba(0,0,0,.18); }
  .slide.editable .tx:focus{ border:3px solid var(--blue); background:rgba(255,255,255,.75); }
  .tx:empty::before{ content:attr(data-ph); color:#b5aca4; }
  .band{
    color:#fff; font-weight:bold; display:flex; align-items:center; justify-content:center;
    border-radius:16px; box-shadow:0 3px 0 rgba(0,0,0,.15);
  }
  .rowbadge{
    position:absolute; display:flex; align-items:center; justify-content:center;
    font-weight:bold; color:#fff; border-radius:50%;
  }
  .rowbg{ position:absolute; border-radius:16px; }
  .photo{
    position:absolute; border-radius:14px; display:flex; align-items:center; justify-content:center;
    flex-direction:column; overflow:hidden; background:rgba(255,255,255,.6);
  }
  .slide.editable .photo{ border:3px dashed #90A4AE; cursor:pointer; }
  .photo img{ width:100%; height:100%; object-fit:cover; }
  .photo .phEmpty{ color:#78909C; font-weight:bold; text-align:center; font-size:24px; line-height:1.4; pointer-events:none; }
  .photo .phX{
    position:absolute; top:6px; right:6px; width:34px; height:34px; border-radius:50%;
    background:rgba(244,67,54,.9); color:#fff; font-size:18px; font-weight:bold; display:none;
  }
  .slide.editable .photo:hover .phX, .slide.editable .photo .phX{ display:block; }
  .stamp{ position:absolute; user-select:none; line-height:1; cursor:grab; }
  .stamp.shape{ line-height:0; }
  .stamp.shape svg{ width:100%; height:100%; display:block; pointer-events:none; }
  .slide.editable .stamp.sel{ outline:3px dashed var(--red); outline-offset:4px; border-radius:8px; }
  /* スタンプの おおきさを かえる つまみ */
  .stHandle{
    position:absolute; right:-18px; bottom:-18px; width:34px; height:34px; border-radius:50%;
    background:var(--red); border:3px solid #fff; box-shadow:0 2px 7px rgba(0,0,0,.45);
    color:#fff; font-size:16px; font-weight:bold; line-height:28px; text-align:center;
    cursor:nwse-resize; touch-action:none; z-index:6;
  }

  /* しゃしんの うえの かきこみ */
  .photo .pdraw{ position:absolute; inset:0; width:100%; height:100%; object-fit:fill; pointer-events:none; z-index:2; }
  .photo .phBtns{ position:absolute; bottom:6px; right:6px; display:flex; gap:6px; z-index:4; }
  .photo .phBtn{
    padding:7px 12px; border-radius:12px; background:rgba(33,150,243,.94); color:#fff;
    font-size:17px; font-weight:bold; box-shadow:0 2px 6px rgba(0,0,0,.35);
  }
  .photo .phBtn:active{ transform:translateY(2px); }

  /* ===== テンプレえらび ===== */
  .modalWrap{
    position:fixed; inset:0; background:rgba(0,0,0,.45); display:none;
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modalWrap.show{ display:flex; }
  .modal{
    background:#FFF8E1; border-radius:20px; padding:20px; max-width:720px; width:100%;
    max-height:90%; overflow-y:auto; box-shadow:0 10px 40px rgba(0,0,0,.35);
  }
  .modal h2{ margin:0 0 14px; color:#5D4037; font-size:20px; text-align:center; }
  #tplGrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .tplCard{
    background:#fff; border:3px solid #FFCC80; border-radius:14px; padding:12px 8px;
    font-size:16px; font-weight:bold; color:#5D4037; text-align:center;
  }
  .tplCard:active{ background:#FFF3E0; }
  .tplCard .big{ font-size:34px; display:block; margin-bottom:6px; }
  .modal .close{ display:block; margin:16px auto 0; font-size:15px; font-weight:bold; padding:10px 24px; border-radius:12px; background:#BDBDBD; color:#fff; }
  .stGroupTitle{ font-size:16px; font-weight:bold; color:#795548; margin:14px 0 6px; }
  .stGrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:8px; }
  .stampChoice{ font-size:38px; background:#fff; border-radius:12px; padding:8px 4px; line-height:1.1; }
  .stampChoice:active{ background:#FFF3E0; }
  .stampChoice svg{ width:46px; height:46px; display:block; margin:0 auto; }

  /* ===== ひらがな もじばん ===== */
  #kbd{
    display:none; flex-direction:column; gap:8px; padding:8px 10px;
    background:#FFF9C4; border-top:3px solid #FFE082; flex-shrink:0;
  }
  #kbd.show{ display:flex; }
  #kbdTabs{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .kTab{
    font-size:15px; font-weight:bold; padding:7px 15px; border-radius:12px;
    background:#fff; color:#5D4037; box-shadow:0 2px 0 rgba(0,0,0,.14);
  }
  .kTab.sel{ background:var(--orange); color:#fff; }
  #kbdHint{ font-size:13px; color:#8D6E63; }
  #kbdBody{ display:flex; gap:10px; align-items:flex-start; }
  #kbdGrid{ flex:1; display:grid; grid-template-columns:repeat(11,1fr); gap:4px; }
  .kKey{
    font-size:25px; font-weight:bold; padding:4px 0; min-height:44px; border-radius:10px;
    background:#fff; color:#3E2723; box-shadow:0 2px 0 rgba(0,0,0,.16);
  }
  .kKey:active{ transform:translateY(2px); box-shadow:none; background:#FFF3E0; }
  .kKey.blank{ background:transparent; box-shadow:none; pointer-events:none; }
  #kbdUtil{ display:grid; grid-template-columns:repeat(2,84px); gap:5px; align-content:start; }
  .kUtil{
    font-size:14px; font-weight:bold; padding:6px 4px; min-height:44px; border-radius:10px;
    background:#FFE0B2; color:#5D4037; box-shadow:0 2px 0 rgba(0,0,0,.16); line-height:1.25;
  }
  .kUtil:active{ transform:translateY(2px); box-shadow:none; }
  .kUtil .kBig{ font-size:19px; }
  .toolbtn.on{ background:var(--orange); color:#fff; }

  /* ===== しゃしんに かきこむ ===== */
  #drawWrap{
    position:fixed; inset:0; background:rgba(38,50,56,.96); display:none; z-index:200;
    flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:12px;
  }
  #drawWrap.show{ display:flex; }
  #drawBar{
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
    background:#FFF9C4; border-radius:16px; padding:9px 14px; max-width:100%;
  }
  #drawBar .toolLabel{ font-size:14px; }
  .dcol{ width:38px; height:38px; border-radius:50%; border:3px solid #fff; box-shadow:0 2px 5px rgba(0,0,0,.35); padding:0; }
  .dcol.sel{ border-color:var(--red); transform:scale(1.14); }
  .dwid{ background:#fff; border-radius:10px; padding:7px 11px; font-size:14px; font-weight:bold; color:#5D4037; box-shadow:0 2px 0 rgba(0,0,0,.14); }
  .dwid.sel{ background:var(--blue); color:#fff; }
  #drawBox{ position:relative; border-radius:10px; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.55); background:#000; }
  #drawImg{ display:block; width:100%; height:100%; object-fit:cover; }
  #drawCv{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair; }

  /* ===== はっぴょうモード ===== */
  #present{
    position:fixed; inset:0; background:#263238; display:none; z-index:100;
    align-items:center; justify-content:center;
  }
  #present.show{ display:flex; }
  #pHolder{ position:relative; }
  .pnav{
    position:fixed; top:50%; transform:translateY(-50%); font-size:34px; width:64px; height:64px;
    border-radius:50%; background:rgba(255,255,255,.85); color:#37474F; z-index:110; font-weight:bold;
  }
  #pPrev{ left:14px; } #pNext{ right:14px; }
  #pClose{
    position:fixed; top:12px; right:14px; font-size:20px; font-weight:bold; z-index:110;
    background:rgba(255,255,255,.85); border-radius:12px; padding:10px 16px; color:#37474F;
  }
  #pDots{
    position:fixed; bottom:14px; left:0; right:0; text-align:center; z-index:110;
    color:#fff; font-size:18px; font-weight:bold; text-shadow:0 1px 3px #000;
  }

  #fileInput,#loadInput{ display:none; }

  @media (max-width:700px){
    #sidebar{ width:120px; }
    .thumb .tstage{ width:96px; height:54px; }
    #topbar h1{ font-size:16px; }
    .tbtn{ font-size:13px; padding:7px 9px; }
    .kKey{ font-size:19px; min-height:36px; }
    #kbdUtil{ grid-template-columns:repeat(2,66px); }
    .kUtil{ font-size:12px; min-height:36px; }
  }
</style>
</head>
<body>

<header id="topbar">
  <h1>🐞 はっぴょうメーカー</h1>
  <button class="tbtn primary" id="presentBtn">▶ はっぴょうする</button>
  <span class="spacer"></span>
  <button class="tbtn" id="sampleBtn">🐛 おてほん</button>
  <button class="tbtn" id="saveBtn">💾 ほぞん</button>
  <button class="tbtn" id="openBtn">📂 ひらく</button>
  <!-- ↓Google Apps Script で うごかしたときだけ 出る -->
  <button class="tbtn" id="sendBtn" style="display:none;background:#009688;color:#fff;">📤 せんせいに おくる</button>
  <button class="tbtn" id="teacherBtn" style="display:none;background:#5D4037;color:#fff;">👩‍🏫 みんなの さくひん</button>
</header>

<div id="main">
  <aside id="sidebar">
    <div id="thumbList" style="display:flex;flex-direction:column;gap:8px;"></div>
    <button id="addSlideBtn">＋ スライドを<br>ふやす</button>
  </aside>

  <section id="editArea">
    <div id="toolbar">
      <span class="toolLabel">いろ:</span>
      <span id="palette"></span>
      <button class="toolbtn" id="stampBtn">😊 スタンプ</button>
      <button class="toolbtn" id="kbdBtn">あ もじばん</button>
      <button class="toolbtn mic" id="micBtn">🎤 こえで かく</button>
      <span id="stampTools">
        <span class="toolLabel">スタンプ:</span>
        <button class="toolbtn" id="stBig">おおきく</button>
        <button class="toolbtn" id="stSmall">ちいさく</button>
        <button class="toolbtn" id="stDel">🗑 けす</button>
        <span class="toolLabel">(あかい ⤡ を ひっぱっても かえられるよ)</span>
      </span>
    </div>
    <div id="stage"><div id="slideHolder"></div></div>

    <!-- ひらがな もじばん -->
    <div id="kbd">
      <div id="kbdTabs">
        <button class="kTab sel" data-set="hira">ひらがな</button>
        <button class="kTab" data-set="kata">カタカナ</button>
        <button class="kTab" data-set="num">すうじ・きごう</button>
        <span id="kbdHint">かきたい ばしょを タップしてから、もじを おしてね</span>
        <span style="flex:1"></span>
        <button class="kTab" id="kbdHide">✕ とじる</button>
      </div>
      <div id="kbdBody">
        <div id="kbdGrid"></div>
        <div id="kbdUtil">
          <button class="kUtil" data-u="daku"><span class="kBig">゛</span><br>だくてん</button>
          <button class="kUtil" data-u="handaku"><span class="kBig">゜</span><br>まる</button>
          <button class="kUtil" data-u="small"><span class="kBig">ゃ</span><br>ちいさく</button>
          <button class="kUtil" data-u="space"><span class="kBig">␣</span><br>あける</button>
          <button class="kUtil" data-u="del"><span class="kBig">⌫</span><br>けす</button>
          <button class="kUtil" data-u="br"><span class="kBig">↵</span><br>つぎのぎょう</button>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- テンプレえらび -->
<div class="modalWrap" id="tplModal">
  <div class="modal">
    <h2>どんな スライドを つくる?</h2>
    <div id="tplGrid"></div>
    <button class="close" id="tplClose">やめる</button>
  </div>
</div>

<!-- スタンプえらび -->
<div class="modalWrap" id="stampModal">
  <div class="modal">
    <h2>すきな スタンプを えらぼう</h2>
    <div id="stampGroups"></div>
    <button class="close" id="stampClose">やめる</button>
  </div>
</div>

<!-- しゃしんに かきこむ -->
<div id="drawWrap">
  <div id="drawBar">
    <span class="toolLabel">いろ:</span>
    <span id="drawColors"></span>
    <button class="dwid" data-w="6">ほそい</button>
    <button class="dwid sel" data-w="11">ふつう</button>
    <button class="dwid" data-w="20">ふとい</button>
    <button class="dwid" id="drawErase">🧽 けしゴム</button>
    <button class="toolbtn" id="drawUndo">↩ もどす</button>
    <button class="toolbtn" id="drawClear">🗑 ぜんぶ けす</button>
    <button class="tbtn primary" id="drawDone" style="font-size:16px;padding:10px 20px;">✓ できた</button>
    <button class="close" id="drawCancel" style="margin:0;padding:10px 18px;">やめる</button>
  </div>
  <div id="drawBox"><img id="drawImg" alt=""><canvas id="drawCv"></canvas></div>
</div>

<!-- なまえをつけて ほぞん -->
<div class="modalWrap" id="saveModal">
  <div class="modal" style="max-width:460px;text-align:center;">
    <h2>なまえを つけて ほぞん</h2>
    <p style="font-size:14px;color:#8D6E63;margin:0 0 8px;">じぶんの なまえや くみを かいてね</p>
    <input type="text" id="saveName" maxlength="24" placeholder="れい: 2ねん1くみ たろう"
      style="width:92%;padding:12px;font-size:18px;border:2px solid #FFB74D;border-radius:12px;text-align:center;box-sizing:border-box;">
    <div id="saveOver"></div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;">
      <button class="close" id="saveCancel" style="margin:0;">やめる</button>
      <button class="tbtn primary" id="saveDo" style="font-size:16px;padding:10px 22px;">💾 ほぞんする</button>
    </div>
  </div>
</div>

<!-- ほぞんした はっぴょうを ひらく -->
<div class="modalWrap" id="loadModal">
  <div class="modal" style="max-width:460px;">
    <h2>ほぞんした はっぴょうを ひらく</h2>
    <div id="slotList"></div>
    <button class="close" id="loadCancel">やめる</button>
  </div>
</div>

<!-- せんせいに おくる -->
<div class="modalWrap" id="sendModal">
  <div class="modal" style="max-width:460px;text-align:center;">
    <h2>📤 せんせいに おくる</h2>
    <p style="font-size:14px;color:#8D6E63;margin:0 0 8px;">なまえを かいて、おくるボタンを おしてね</p>
    <input type="text" id="sendName" maxlength="24" placeholder="れい: 1ねん1くみ たろう"
      style="width:92%;padding:12px;font-size:18px;border:2px solid #FFB74D;border-radius:12px;text-align:center;box-sizing:border-box;">
    <div id="sendChips"></div>
    <div id="sendProg" style="display:none;font-size:16px;font-weight:bold;color:#00796B;margin-top:14px;"></div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;">
      <button class="close" id="sendCancel" style="margin:0;">やめる</button>
      <button class="tbtn primary" id="sendDo" style="font-size:16px;padding:10px 22px;background:#009688;">📤 おくる</button>
    </div>
  </div>
</div>

<!-- みんなの さくひん(せんせい用) -->
<div class="modalWrap" id="teacherModal">
  <div class="modal" style="max-width:560px;">
    <h2>👩‍🏫 みんなの さくひん</h2>
    <div id="workList"></div>
    <button class="close" id="teacherCancel">とじる</button>
  </div>
</div>

<!-- はっぴょうモード -->
<div id="present">
  <div id="pHolder"></div>
  <button class="pnav" id="pPrev">◀</button>
  <button class="pnav" id="pNext">▶</button>
  <button id="pClose">✕ おわる</button>
  <div id="pDots"></div>
</div>

<input type="file" id="fileInput" accept="image/*">

<script>
'use strict';
/* =========================================================
   はっぴょうメーカー — 小学2年生むけプレゼンづくりアプリ
   単一HTML / localStorage自動保存 / なまえつき保存スロット(ダウンロード不使用)
   ========================================================= */

const STORE_KEY = 'happyo-maker-v1';
const BG_COLORS = ['#FFFFFF','#FFF8E1','#E8F5E9','#E3F2FD','#FCE4EC','#EDE7F6'];

/* ---------- えスタンプ(絵文字にない ものは SVGで つくる) ---------- */
const SHAPES = {
  donguri: { label:'どんぐり', d:96, svg:
    '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
    '<ellipse cx="50" cy="66" rx="27" ry="30" fill="#C58B45"/>' +

/* ---------- じょうたい ---------- */
let state = { slides: [], cur: 0 };

let photoTargetKey = null;
let pIndex = 0;             // はっぴょうモードの ページ

function newSlide(tplKey){
  const t = TPL[tplKey];
  const s = { tpl: tplKey, bg: 1, texts: {}, photos: {}, draws: {}, stamps: [] };
  if (t.heading !== undefined) s.texts.h = t.heading;
  t.boxes.forEach(b => { if (b.def) s.texts[b.k] = b.def; });
  if (t.defStamps) s.stamps = t.defStamps.map(x => ({...x}));
  return s;
}

/* ---------- ほぞん・よみこみ ---------- */
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch(e){ console.warn('save failed', e); }
  }, 400);
}
function loadStore(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw){ const d = JSON.parse(raw); if (d && Array.isArray(d.slides) && d.slides.length) { state = d; return; } }
  } catch(e){}
  state = { slides: [newSlide('title')], cur: 0 };
}

/* ---------- スライドの えがき ---------- */
function renderSlide(slide, opts){
  const t = TPL[slide.tpl];
  const el = document.createElement('div');
  el.className = 'slide' + (opts.edit ? ' editable' : '');
  el.style.background = BG_COLORS[slide.bg] || '#fff';

  // みだしバンド
  if (t.heading !== undefined){
    const band = document.createElement('div');
    band.className = 'band box';
    Object.assign(band.style, { left:'40px', top:'28px', width:'880px', height:'74px', background:t.accent, fontSize:'34px' });
    const htx = mkText(slide, 'h', { size:34, align:'center', ph:'みだし' }, opts, true);
    htx.style.position = 'static'; htx.style.width = '96%'; htx.style.color = '#fff'; htx.style.border = 'none';
    band.appendChild(htx);
    el.appendChild(band);
  }

  t.boxes.forEach(b => {
    if (b.type === 'photo'){
      // しゃしんが ないときは、はっぴょうでは わくを ださない
      if (slide.photos[b.k] || opts.edit) el.appendChild(mkPhoto(slide, b, opts));
    } else if (b.type === 'row'){
      const bg = document.createElement('div');
      bg.className = 'rowbg';
      Object.assign(bg.style, { left:b.x+'px', top:b.y+'px', width:b.w+'px', height:b.h+'px', background:'rgba(255,255,255,.75)', boxShadow:'0 2px 5px rgba(0,0,0,.08)' });
      el.appendChild(bg);
      const badge = document.createElement('div');
      badge.className = 'rowbadge';
      Object.assign(badge.style, { left:(b.x+14)+'px', top:(b.y+b.h/2-27)+'px', width:'54px', height:'54px', background:t.accent, fontSize:'28px' });
      badge.textContent = b.n;
      el.appendChild(badge);
      const tx = mkText(slide, b.k, b, opts);
      Object.assign(tx.style, { left:(b.x+84)+'px', top:(b.y+10)+'px', width:(b.w-100)+'px', height:(b.h-20)+'px' });
      el.appendChild(tx);
    } else {
      const tx = mkText(slide, b.k, b, opts);
      Object.assign(tx.style, { left:b.x+'px', top:b.y+'px', width:b.w+'px', height:b.h+'px' });
      if (b.bg) tx.style.background = b.bg;
      el.appendChild(tx);
    }
  });

  // スタンプ
  slide.stamps.forEach((st, i) => {
    const isSel = opts.edit && i === selStamp;
    const sp = document.createElement('div');
    sp.className = 'stamp' + (isSel ? ' sel' : '');
    applyStampStyle(sp, st);
    Object.assign(sp.style, { left:st.x+'px', top:st.y+'px' });
    if (opts.edit){
      sp.addEventListener('pointerdown', ev => startStampDrag(ev, i));
      if (isSel){
        const h = document.createElement('div');
        h.className = 'stHandle'; h.textContent = '⤡';
        h.addEventListener('pointerdown', ev => startStampResize(ev, i));
        sp.appendChild(h);
      }
    }
    el.appendChild(sp);
  });

  if (opts.edit){
    // なにもない ところを タップ → スタンプせんたく かいじょ
    el.addEventListener('pointerdown', ev => {
      if (ev.target === el){ selStamp = -1; refreshStampUI(); }
    });
  }
  return el;
}

function mkText(slide, key, def, opts, inBand){
  const tx = document.createElement('div');
  tx.className = 'tx box';
  tx.style.fontSize = def.size + 'px';
  if (def.bold) tx.style.fontWeight = 'bold';
  if (def.align) tx.style.textAlign = def.align;
  tx.dataset.ph = opts.edit ? (def.ph || '') : '';
  tx.textContent = slide.texts[key] || '';
  if (opts.edit){
    tx.contentEditable = 'true';
    tx.dataset.key = key;
    tx.addEventListener('focus', () => { focusedTextKey = key; selStamp = -1; refreshStampUI(); });
    tx.addEventListener('input', () => {
      if (tx.innerText.trim() === '' && tx.textContent === '') tx.innerHTML = '';
      slide.texts[key] = tx.innerText.replace(/\n$/,'');
      save(); queueThumb();
    });
    tx.addEventListener('blur', () => { if (tx.innerText.trim() === '') { tx.innerHTML = ''; slide.texts[key] = ''; save(); } });
  }
  return tx;
}

function mkPhoto(slide, b, opts){
  const ph = document.createElement('div');
  ph.className = 'photo';
  Object.assign(ph.style, { left:b.x+'px', top:b.y+'px', width:b.w+'px', height:b.h+'px' });
  const data = slide.photos[b.k];
  if (data){
    const img = document.createElement('img');
    img.src = data;
    ph.appendChild(img);
    // しゃしんの うえの かきこみ(すきとおった え)
    const dr = (slide.draws || {})[b.k];
    if (dr){
      const di = document.createElement('img');
      di.className = 'pdraw'; di.src = dr;
      ph.appendChild(di);
    }
  } else {
    const hint = document.createElement('div');
    hint.className = 'phEmpty';
    hint.innerHTML = opts.edit ? '📷<br>タップして<br>しゃしんを いれる' : '';
    ph.appendChild(hint);
  }
  if (opts.edit){
    ph.addEventListener('click', ev => {
      if (ev.target.classList.contains('phX')) return;
      photoTargetKey = b.k;
      document.getElementById('fileInput').click();
    });
    if (data){
      const x = document.createElement('button');
      x.className = 'phX'; x.textContent = '✕';
      x.addEventListener('click', ev => {
        ev.stopPropagation();
        if (confirm('この しゃしんを けしますか?')){
          delete slide.photos[b.k];
          if (slide.draws) delete slide.draws[b.k];
          save(); renderEditor(); renderThumbs();
        }
      });
      ph.appendChild(x);

      const btns = document.createElement('div');
      btns.className = 'phBtns';
      const pen = document.createElement('button');
      pen.className = 'phBtn'; pen.textContent = '✏️ かきこむ';
      pen.addEventListener('click', ev => { ev.stopPropagation(); openDraw(b); });
      btns.appendChild(pen);
      ph.appendChild(btns);
    }
  }
  return ph;
}

/* ---------- エディタ ---------- */
function renderEditor(){
  const holder = document.getElementById('slideHolder');
  holder.innerHTML = '';
  const slide = state.slides[state.cur];
  if (!slide) return;
  const stage = document.getElementById('stage');
  const availW = stage.clientWidth - 28, availH = stage.clientHeight - 28;
  editScale = Math.min(availW / 960, availH / 540, 1.2);
  holder.style.width = (960 * editScale) + 'px';
  holder.style.height = (540 * editScale) + 'px';
  const el = renderSlide(slide, { edit:true });
  el.style.transform = `scale(${editScale})`;
  holder.appendChild(el);
  // いろパレットの せんたくひょうじ
  document.querySelectorAll('#palette .swatch').forEach((sw, i) => sw.classList.toggle('sel', i === slide.bg));
}

let thumbTimer = null;
function queueThumb(){ clearTimeout(thumbTimer); thumbTimer = setTimeout(renderThumbs, 600); }

function renderThumbs(){
  const list = document.getElementById('thumbList');
  list.innerHTML = '';
  const tw = window.innerWidth <= 700 ? 96 : 150;
  const scale = tw / 960;
  state.slides.forEach((slide, i) => {
    const card = document.createElement('div');
    card.className = 'thumb' + (i === state.cur ? ' sel' : '');
    const stg = document.createElement('div');
    stg.className = 'tstage';
    const el = renderSlide(slide, { edit:false });
    el.style.transform = `scale(${scale})`;
    stg.appendChild(el);
    const num = document.createElement('span');
    num.className = 'tnum'; num.textContent = i + 1;
    card.appendChild(num); card.appendChild(stg);

    const ctrl = document.createElement('div');
    ctrl.className = 'tctrl';
    ctrl.innerHTML = `<button data-a="up" title="うえへ">⬆️</button><button data-a="down" title="したへ">⬇️</button><button data-a="del" title="けす">🗑</button>`;
    card.appendChild(ctrl);

    card.addEventListener('click', ev => {
      const a = ev.target.dataset && ev.target.dataset.a;
      if (a === 'up' && i > 0){
        [state.slides[i-1], state.slides[i]] = [state.slides[i], state.slides[i-1]];
        state.cur = i - 1; save(); renderAll(); return;
      }
      if (a === 'down' && i < state.slides.length - 1){
        [state.slides[i+1], state.slides[i]] = [state.slides[i], state.slides[i+1]];
        state.cur = i + 1; save(); renderAll(); return;
      }
      if (a === 'del'){
        if (state.slides.length === 1){ alert('さいごの 1まいは けせないよ'); return; }
        if (confirm((i+1) + 'ばんめの スライドを けしますか?')){
          state.slides.splice(i, 1);
          if (state.cur >= state.slides.length) state.cur = state.slides.length - 1;
          save(); renderAll();
        }
        return;
      }
      state.cur = i; selStamp = -1; renderAll();
    });
    list.appendChild(card);
  });
}

function renderAll(){ renderEditor(); renderThumbs(); refreshStampUI(); }

/* ---------- いろ ---------- */
function buildPalette(){
  const p = document.getElementById('palette');
  BG_COLORS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'swatch'; b.style.background = c;
    b.addEventListener('click', () => {
      state.slides[state.cur].bg = i; save(); renderAll();
    });
    p.appendChild(b);

/* ---------- スタンプ ---------- */
function applyStampStyle(sp, st){
  if (st.sh && SHAPES[st.sh]){
    sp.classList.add('shape');
    sp.style.width = st.s + 'px'; sp.style.height = st.s + 'px';
    sp.innerHTML = SHAPES[st.sh].svg;
  } else {
    sp.textContent = st.e;
    sp.style.fontSize = st.s + 'px';
  }
}

function buildStampPicker(){
  const wrap = document.getElementById('stampGroups');
  STAMP_GROUPS.forEach(g => {
    const h = document.createElement('div');
    h.className = 'stGroupTitle'; h.textContent = g.title;
    wrap.appendChild(h);
    const grid = document.createElement('div');
    grid.className = 'stGrid';
    g.items.forEach(it => {
      const b = document.createElement('button');
      b.className = 'stampChoice';
      if (typeof it === 'string'){
        b.textContent = it;
        b.addEventListener('click', () => addStamp({ e: it, s: 68 }));
      } else {
        const sh = SHAPES[it.sh];
        b.innerHTML = sh.svg;
        b.title = sh.label;
        b.addEventListener('click', () => addStamp({ sh: it.sh, s: sh.d || 90 }));
      }
      grid.appendChild(b);
    });
    wrap.appendChild(grid);
  });
}

function addStamp(o){
  const slide = state.slides[state.cur];
  const s = o.s;
  slide.stamps.push(Object.assign({ x: Math.round(480 - s/2), y: Math.round(270 - s/2) }, o));
  selStamp = slide.stamps.length - 1;
  document.getElementById('stampModal').classList.remove('show');
  save(); renderEditor(); queueThumb(); refreshStampUI();
}

function refreshStampUI(){
  document.getElementById('stampTools').classList.toggle('show', selStamp >= 0);
  // せんたくわくの ひょうじを こうしん
  const holder = document.getElementById('slideHolder');
  holder.querySelectorAll('.stamp').forEach((sp, i) => sp.classList.toggle('sel', i === selStamp));
}

function startStampDrag(ev, idx){
  ev.preventDefault(); ev.stopPropagation();
  selStamp = idx; refreshStampUI();
  const slide = state.slides[state.cur];
  const st = slide.stamps[idx];
  const startX = ev.clientX, startY = ev.clientY, ox = st.x, oy = st.y;
  const move = e => {
    st.x = Math.max(-30, Math.min(930, ox + (e.clientX - startX) / editScale));
    st.y = Math.max(-30, Math.min(510, oy + (e.clientY - startY) / editScale));
    const sp = document.getElementById('slideHolder').querySelectorAll('.stamp')[idx];
    if (sp){ sp.style.left = st.x + 'px'; sp.style.top = st.y + 'px'; }
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    save(); queueThumb();
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

/* つまみを ひっぱって おおきさを かえる */
function startStampResize(ev, idx){
  ev.preventDefault(); ev.stopPropagation();
  selStamp = idx;
  const st = state.slides[state.cur].stamps[idx];
  if (!st) return;
  const startX = ev.clientX, startY = ev.clientY, os = st.s;
  const move = e => {
    const dx = (e.clientX - startX) / editScale;
    const dy = (e.clientY - startY) / editScale;
    st.s = Math.max(24, Math.min(400, Math.round(os + (dx + dy) / 2)));
    const sp = document.getElementById('slideHolder').querySelectorAll('.stamp')[idx];
    if (sp){
      if (st.sh){ sp.style.width = st.s + 'px'; sp.style.height = st.s + 'px'; }
      else sp.style.fontSize = st.s + 'px';
    }
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    save(); queueThumb();
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

/* ---------- しゃしんに かきこむ ----------
   しゃしんは そのまま のこして、うえに すきとおった え(PNG)を かさねる。
   だから なんども かきなおせるし、けしても しゃしんは きえない。 */
const D_COLORS = ['#F44336','#1E88E5','#FFD600','#4CAF50','#000000','#FFFFFF'];
let drawBox = null;      // かきこむ たいしょうの わく(TPLの box)
let dCv = null, dCtx = null;
let dColor = '#F44336', dWidth = 11, dErase = false;
let dUndo = [], dDirty = false, dDrawing = false;

function buildDrawColors(){
  const wrap = document.getElementById('drawColors');
  D_COLORS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'dcol' + (i === 0 ? ' sel' : '');
    b.style.background = c;
    b.addEventListener('click', () => {
      dColor = c; dErase = false;
      document.getElementById('drawErase').classList.remove('sel');
      wrap.querySelectorAll('.dcol').forEach(x => x.classList.toggle('sel', x === b));
    });
    wrap.appendChild(b);

}

function openDraw(box){
  const slide = state.slides[state.cur];
  if (!slide.photos[box.k]) return;
  drawBox = box;
  dCv = document.getElementById('drawCv');
  dCtx = dCv.getContext('2d');
  dCv.width = box.w * 2; dCv.height = box.h * 2;   // 2ばいで かいて きれいに
  dCtx.clearRect(0, 0, dCv.width, dCv.height);
  dUndo = []; dDirty = false;

  document.getElementById('drawImg').src = slide.photos[box.k];
  const maxW = Math.min(window.innerWidth - 24, 1000);
  const maxH = window.innerHeight - 170;
  const sc = Math.min(maxW / box.w, maxH / box.h);
  const bx = document.getElementById('drawBox');
  bx.style.width = Math.round(box.w * sc) + 'px';
  bx.style.height = Math.round(box.h * sc) + 'px';

  const cur = (slide.draws || {})[box.k];
  if (cur){
    const im = new Image();
    im.onload = () => { dCtx.drawImage(im, 0, 0, dCv.width, dCv.height); };
    im.src = cur;
  }
  document.getElementById('drawWrap').classList.add('show');
}

function dPos(e){
  const r = dCv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * dCv.width / r.width,
           y: (e.clientY - r.top) * dCv.height / r.height };
}
function pushUndo(){
  try { dUndo.push(dCv.toDataURL('image/png')); } catch(e){}
  if (dUndo.length > 10) dUndo.shift();
}
function dStrokeStart(e){
  if (!dCtx) return;
  e.preventDefault();
  pushUndo();
  dDrawing = true; dDirty = true;
  dCtx.lineCap = 'round'; dCtx.lineJoin = 'round';
  dCtx.globalCompositeOperation = dErase ? 'destination-out' : 'source-over';
  dCtx.strokeStyle = dColor;
  dCtx.lineWidth = (dErase ? dWidth * 2.6 : dWidth) * 2;
  const p = dPos(e);
  dCtx.beginPath(); dCtx.moveTo(p.x, p.y);
  dCtx.lineTo(p.x + 0.1, p.y + 0.1); dCtx.stroke();   // タップだけでも てんが つく
}
function dStrokeMove(e){
  if (!dDrawing) return;
  e.preventDefault();
  const p = dPos(e);
  dCtx.lineTo(p.x, p.y); dCtx.stroke();
}
function dStrokeEnd(){
  if (!dDrawing) return;
  dDrawing = false;
  dCtx.globalCompositeOperation = 'source-over';
}
document.getElementById('drawCv').addEventListener('pointerdown', dStrokeStart);
document.getElementById('drawCv').addEventListener('pointermove', dStrokeMove);
window.addEventListener('pointerup', dStrokeEnd);
window.addEventListener('pointercancel', dStrokeEnd);

document.getElementById('drawUndo').addEventListener('click', () => {
  const last = dUndo.pop();
  if (last === undefined){ toast('もどせる かきこみが ないよ'); return; }
  const im = new Image();
  im.onload = () => { dCtx.clearRect(0,0,dCv.width,dCv.height); dCtx.drawImage(im,0,0,dCv.width,dCv.height); };
  im.src = last;
  dDirty = true;
});
document.getElementById('drawClear').addEventListener('click', () => {
  pushUndo();
  dCtx.clearRect(0, 0, dCv.width, dCv.height);

function closeDraw(){
  document.getElementById('drawWrap').classList.remove('show');

}
function canvasEmpty(cv){
  const d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
  for (let i = 3; i < d.length; i += 4) if (d[i] !== 0) return false;
  return true;
}

      delete slide.draws[box.k];
    } else {
      // ほぞんは わくと おなじ おおきさに して データを かるくする
      const tmp = document.createElement('canvas');
      tmp.width = box.w; tmp.height = box.h;

/* ---------- ひらがな もじばん ----------
   1年生は キーボードが うてないので、五十音表を タップして 入力できるようにする。
   ボタンを おしても 文字ボックスの フォーカスが はずれないよう mousedown を とめる。 */
const KANA_ROWS = [
  ['あ','か','さ','た','な','は','ま','や','ら','わ','ん'],
  ['い','き','し','ち','に','ひ','み','' ,'り','' ,'ー'],
  ['う','く','す','つ','ぬ','ふ','む','ゆ','る','' ,'、'],
  ['え','け','せ','て','ね','へ','め','' ,'れ','' ,'。'],
  ['お','こ','そ','と','の','ほ','も','よ','ろ','を','っ'],
];
const NUM_ROWS = [
  ['1','2','3','4','5','6','7','8','9','0','・'],
  ['！','？','「','」','（','）','〜','＝','＋','ー','／'],
  ['○','△','□','☆','♪','←','→','↑','↓','…','　'],
];
function toKata(s){ return String(s).replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60)); }
function bothKana(map){
  const m = {};
  Object.entries(map).forEach(([k, v]) => { m[k] = v; m[toKata(k)] = toKata(v); });
  return m;
}
function flip(map){
  const m = {};
  Object.entries(map).forEach(([k, v]) => { m[v] = k; });
  return m;
}
const DAKU_BASE = { か:'が',き:'ぎ',く:'ぐ',け:'げ',こ:'ご', さ:'ざ',し:'じ',す:'ず',せ:'ぜ',そ:'ぞ',
  た:'だ',ち:'ぢ',つ:'づ',て:'で',と:'ど', は:'ば',ひ:'び',ふ:'ぶ',へ:'べ',ほ:'ぼ' };
const HANDAKU_BASE = { は:'ぱ',ひ:'ぴ',ふ:'ぷ',へ:'ぺ',ほ:'ぽ' };
const SMALL_BASE = { あ:'ぁ',い:'ぃ',う:'ぅ',え:'ぇ',お:'ぉ', つ:'っ',や:'ゃ',ゆ:'ゅ',よ:'ょ',わ:'ゎ' };
const DAKU_MAP = Object.assign({}, bothKana(DAKU_BASE), flip(bothKana(DAKU_BASE)));
const HANDAKU_MAP = Object.assign({}, bothKana(HANDAKU_BASE), flip(bothKana(HANDAKU_BASE)));
const SMALL_MAP = Object.assign({}, bothKana(SMALL_BASE), flip(bothKana(SMALL_BASE)));

let kbdSet = 'hira';

function buildKbd(){
  const g = document.getElementById('kbdGrid');
  g.innerHTML = '';
  const rows = kbdSet === 'num' ? NUM_ROWS
    : (kbdSet === 'kata' ? KANA_ROWS.map(r => r.map(c => (/[ぁ-ゖ]/.test(c) ? toKata(c) : c))) : KANA_ROWS);
  rows.forEach(row => row.forEach(ch => {
    const b = document.createElement('button');
    if (!ch){ b.className = 'kKey blank'; b.disabled = true; }
    else {
      b.className = 'kKey';
      b.textContent = ch === '　' ? '␣' : ch;
      b.addEventListener('click', () => kbdInsert(ch));
    }
    g.appendChild(b);
  }));
}
document.querySelectorAll('.kTab[data-set]').forEach(t => {
  t.addEventListener('click', () => {
    kbdSet = t.dataset.set;
    document.querySelectorAll('.kTab[data-set]').forEach(x => x.classList.toggle('sel', x === t));
    buildKbd();
  });
});

function caretEnd(el){
  const r = document.createRange();
  r.selectNodeContents(el); r.collapse(false);
  const s = window.getSelection();
  s.removeAllRanges(); s.addRange(r);
}
/* いま かいている 文字ボックス。なければ まえに さわっていた ところに もどす */
function curTx(){
  const holder = document.getElementById('slideHolder');
  const act = document.activeElement;
  if (act && act.classList && act.classList.contains('tx') && holder.contains(act)) return act;
  let el = focusedTextKey ? holder.querySelector('.tx[data-key="' + focusedTextKey + '"]') : null;
  if (!el) el = holder.querySelector('.tx');
  if (el){ el.focus(); caretEnd(el); focusedTextKey = el.dataset.key; }
  return el;
}
function syncTx(tx){
  const slide = state.slides[state.cur];
  if (!tx || !tx.dataset.key || !slide) return;
  slide.texts[tx.dataset.key] = tx.innerText.replace(/\n$/, '');
  save(); queueThumb();
}
function insertAtCaret(str){
  let ok = false;
  try { ok = document.execCommand('insertText', false, str); } catch(e){ ok = false; }
  if (!ok){
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const r = sel.getRangeAt(0);
    r.deleteContents();
    const t = document.createTextNode(str);
    r.insertNode(t);
    r.setStartAfter(t); r.collapse(true);
    sel.removeAllRanges(); sel.addRange(r);
  }
}
function kbdInsert(str){
  const tx = curTx(); if (!tx) return;
  insertAtCaret(str);
  syncTx(tx);
}
/* まえの 1もじを ゛ ゜ ちいさく に かえる(もう1回 おすと もとに もどる) */
function kbdModify(map){
  const tx = curTx(); if (!tx) return;
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const r = sel.getRangeAt(0);
  let node = r.startContainer, off = r.startOffset;
  if (node.nodeType !== 3){
    const prev = off > 0 ? node.childNodes[off - 1] : null;
    if (prev && prev.nodeType === 3){ node = prev; off = prev.data.length; }
    else return;
  }
  if (off <= 0) return;
  const nw = map[node.data[off - 1]];
  if (!nw){ toast('その もじには つけられないよ'); return; }
  const r2 = document.createRange();
  r2.setStart(node, off - 1); r2.setEnd(node, off);
  sel.removeAllRanges(); sel.addRange(r2);
  insertAtCaret(nw);
  syncTx(tx);
}
document.querySelectorAll('#kbdUtil .kUtil').forEach(b => {
  b.addEventListener('click', () => {
    const u = b.dataset.u;
    if (u === 'daku') kbdModify(DAKU_MAP);
    else if (u === 'handaku') kbdModify(HANDAKU_MAP);
    else if (u === 'small') kbdModify(SMALL_MAP);
    else if (u === 'space') kbdInsert('　');
    else if (u === 'br') kbdInsert('\n');
    else if (u === 'del'){
      const tx = curTx(); if (!tx) return;
      try { document.execCommand('delete'); } catch(e){}
      syncTx(tx);
    }
  });
});

/* ---------- ほぞん(なまえつき) / ひらく ----------
   ダウンロードは Googleサイト埋め込み(サンドボックス)でブロックされるため、
   ブラウザの中(localStorage)に なまえを つけて ためる方式にする。 */
const SLOTS_KEY = 'happyo-maker-slots-v1';
const LASTNAME_KEY = 'happyo-maker-lastname';
function getSlots(){
  try { const a = JSON.parse(localStorage.getItem(SLOTS_KEY)); return Array.isArray(a) ? a : []; }
  catch(e){ return []; }
}
function setSlots(a){ localStorage.setItem(SLOTS_KEY, JSON.stringify(a)); } // 容量オーバーで throw しうる
function todayStr(){ const d = new Date(); return d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate(); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#4E342E;color:#fff;padding:13px 26px;border-radius:30px;font-size:18px;font-weight:bold;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.35);opacity:0;transition:opacity .25s;max-width:88%;text-align:center;';
  document.body.appendChild(t);
  requestAnimationFrame(() => { t.style.opacity = '1'; });
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2000);
}

function renderSlotList(){

  list.innerHTML = '';
  if (!slots.length){
    list.innerHTML = '<p style="color:#999;padding:16px;text-align:center;line-height:1.7;">まだ ほぞんした ものが ないよ。<br>「💾 ほぞん」で なまえを つけて ほぞんしてね。</p>';
    return;
  }
  const warn = document.createElement('p');
  warn.style.cssText = 'font-size:13px;color:#E57373;text-align:center;margin:2px 0 8px;line-height:1.6;';
  warn.innerHTML = 'ひらくと、いま つくって いる ものは きえるよ。<br>さきに 「💾 ほぞん」して おいてね。';
  list.appendChild(warn);
  slots.slice().reverse().forEach(s => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:10px;border:2px solid #EEE;border-radius:14px;margin:6px 0;background:#fff;';
    const info = document.createElement('div');
    info.style.cssText = 'flex:1;text-align:left;min-width:0;';
    info.innerHTML = '<div style="font-size:17px;font-weight:bold;color:#5D4037;overflow:hidden;text-overflow:ellipsis;">' + escapeHtml(s.name) + '</div><div style="font-size:12px;color:#AAA;">' + escapeHtml(s.date || '') + '</div>';
    const openB = document.createElement('button');
    openB.className = 'tbtn primary';
    openB.style.cssText = 'font-size:15px;padding:9px 14px;white-space:nowrap;';
    openB.textContent = '📂 ひらく';
    openB.onclick = () => {
      state = JSON.parse(JSON.stringify(s.data));
      state.cur = 0; selStamp = -1;
      save(); renderAll();
      loadModal.classList.remove('show');
      toast('「' + s.name + '」を ひらいたよ!');
    };
    const delB = document.createElement('button');
    delB.className = 'tbtn';
    delB.style.cssText = 'font-size:18px;padding:9px 12px;';
    delB.textContent = '🗑';
    delB.onclick = () => {
      const all = getSlots();
      const idx = all.findIndex(x => x.name === s.name);
      if (idx >= 0){ all.splice(idx, 1); setSlots(all); renderSlotList(); }
    };
    row.appendChild(info); row.appendChild(openB); row.appendChild(delB);
    list.appendChild(row);
  });
}

/* ---------- せんせいに おくる (Google Apps Script のウェブアプリのときだけ) ----------
   Googleサイト埋め込みでは そもそも 外に おくれないので、この きのうは
   GAS(HtmlService)で ひらいたときだけ ボタンが 出る。
   通信は google.script.run。データが 大きいので 小分けにして おくる。 */
let GAS = false;             // GASウェブアプリの中で うごいて いるか
const SEND_CHUNK = 150000;   // 1回に おくる 文字数
let gasKey = '';             // URLの ?key=... (せんせいモードの あいことば)
let gasWho = null;           // { email, isTeacher }
let sending = false;

function gasFail(err){
  sending = false;
  setSendProg('');
  document.getElementById('sendDo').disabled = false;
  const msg = (err && err.message) ? err.message : 'わかりません';
  alert('おくれませんでした。もう1かい ためしてね。\n\n(' + msg + ')');
}
function setSendProg(text){
  const el = document.getElementById('sendProg');
  el.textContent = text || '';
  el.style.display = text ? 'block' : 'none';
}

/* GASの google.script.run は アプリの あとから 用意される ことが あるので、
   すぐには 判定せず、来るまで くりかえし たしかめる(最大5びょう)。 */
function gasBoot(tries){
  if (window.google && window.google.script && window.google.script.run){
    GAS = true;
    document.getElementById('sendBtn').style.display = '';
    // iframeの中なので、URLの ?key= は google.script.url でしか よめない
    try {
      google.script.url.getLocation(loc => {
        gasKey = (loc && loc.parameter && loc.parameter.key) || '';
        gasWhoAmI();
      });
    } catch(e){ gasWhoAmI(); }
    return;
  }
  if (tries > 0) setTimeout(() => gasBoot(tries - 1), 200);
}
gasBoot(25);
function gasWhoAmI(){
  google.script.run
    .withSuccessHandler(w => {
      gasWho = w || {};
      if (gasWho.isTeacher) document.getElementById('teacherBtn').style.display = '';
    })
    .withFailureHandler(() => {})
    .getWho(gasKey);
}

/* --- おくる --- */
document.getElementById('sendBtn').addEventListener('click', () => {
  const inp = document.getElementById('sendName');
  inp.value = localStorage.getItem(LASTNAME_KEY) || '';
  setSendProg('');
  document.getElementById('sendDo').disabled = false;
  renderSendChips();
  document.getElementById('sendModal').classList.add('show');
  setTimeout(() => inp.focus(), 50);
});
document.getElementById('sendCancel').addEventListener('click', () => {
  if (sending){ if (!confirm('おくって いる ところだよ。やめる?')) return; }
  sending = false;
  document.getElementById('sendModal').classList.remove('show');
});
function renderSendChips(){
  const box = document.getElementById('sendChips');
  const last = localStorage.getItem(LASTNAME_KEY);
  box.innerHTML = last
    ? '<div style="font-size:13px;color:#999;margin:10px 0 2px;">まえに つかった なまえ: ' + escapeHtml(last) + '</div>'
    : '';
}
function workTitle(){
  const s = state.slides[0];
  if (!s || !s.texts) return '';
  return (s.texts.t1 || s.texts.h || '').replace(/\n/g, ' ').slice(0, 60);
}
function workAllText(){
  return state.slides.map((s, i) => {
    const t = Object.keys(s.texts || {}).map(k => s.texts[k]).filter(v => v).join(' / ');
    return (i + 1) + '. ' + t;
  }).join('\n');
}
document.getElementById('sendDo').addEventListener('click', () => {
  if (sending) return;
  const name = (document.getElementById('sendName').value || '').trim();
  if (!name){ alert('なまえを かいてね'); return; }
  const json = JSON.stringify(state);
  const chunks = [];
  for (let i = 0; i < json.length; i += SEND_CHUNK) chunks.push(json.slice(i, i + SEND_CHUNK));
  const meta = { name: name, title: workTitle(), slides: state.slides.length, text: workAllText().slice(0, 40000) };
  sending = true;
  document.getElementById('sendDo').disabled = true;
  setSendProg('じゅんび しています…');
  google.script.run.withSuccessHandler(id => sendChunk(id, chunks, 0, name))
    .withFailureHandler(gasFail).startUpload(meta);
});
function sendChunk(uploadId, chunks, i, name){
  if (!sending) return;                       // やめる を おされた
  if (i >= chunks.length){
    setSendProg('もう すこし…');
    google.script.run.withSuccessHandler(() => {
      sending = false;
      localStorage.setItem(LASTNAME_KEY, name);
      setSendProg('');
      document.getElementById('sendDo').disabled = false;
      document.getElementById('sendModal').classList.remove('show');
      toast('せんせいに おくれたよ!');
    }).withFailureHandler(gasFail).finishUpload(uploadId);
    return;
  }
  setSendProg('おくって います… ' + (i + 1) + ' / ' + chunks.length);
  google.script.run.withSuccessHandler(() => sendChunk(uploadId, chunks, i + 1, name))
    .withFailureHandler(gasFail).appendChunk(uploadId, i, chunks[i]);
}

/* --- せんせい用: みんなの さくひん --- */
document.getElementById('teacherBtn').addEventListener('click', () => {
  const list = document.getElementById('workList');
  list.innerHTML = '<p style="text-align:center;color:#999;padding:16px;">よみこんで います…</p>';
  document.getElementById('teacherModal').classList.add('show');
  google.script.run.withSuccessHandler(renderWorkList).withFailureHandler(gasFail).listWorks(gasKey);
});
document.getElementById('teacherCancel').addEventListener('click', () =>
  document.getElementById('teacherModal').classList.remove('show'));

function renderWorkList(works){
  const list = document.getElementById('workList');
  list.innerHTML = '';
  if (!works || !works.length){
    list.innerHTML = '<p style="text-align:center;color:#999;padding:16px;line-height:1.7;">まだ ていしゅつが ありません。</p>';
    return;
  }
  const info = document.createElement('p');
  info.style.cssText = 'font-size:13px;color:#8D6E63;text-align:center;margin:2px 0 10px;line-height:1.6;';
  info.textContent = works.length + 'けん。ひらくと、いま つくって いる ものは きえます。';
  list.appendChild(info);
  works.forEach(w => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:10px;border:2px solid #EEE;border-radius:14px;margin:6px 0;background:#fff;';
    const box = document.createElement('div');
    box.style.cssText = 'flex:1;text-align:left;min-width:0;';
    box.innerHTML = '<div style="font-size:17px;font-weight:bold;color:#5D4037;">' + escapeHtml(w.name) + '</div>' +
      '<div style="font-size:12px;color:#AAA;">' + escapeHtml(w.date) + ' ・ ' + (w.slides || 0) + 'まい' +
      (w.title ? ' ・ ' + escapeHtml(w.title) : '') + '</div>';
    const open = document.createElement('button');
    open.className = 'tbtn primary';
    open.style.cssText = 'font-size:15px;padding:9px 14px;white-space:nowrap;';
    open.textContent = '📂 ひらく';
    open.onclick = () => {
      if (!confirm('「' + w.name + '」を ひらきます。いま つくって いる ものは きえます。いい?')) return;
      open.textContent = 'よみこみ中…'; open.disabled = true;
      readWork(w.fileId, 0, '', w.name);
    };
    row.appendChild(box); row.appendChild(open);
    list.appendChild(row);
  });
}
function readWork(fileId, index, acc, name){
  google.script.run.withSuccessHandler(res => {
    const text = acc + (res.text || '');
    if (!res.done){ readWork(fileId, index + 1, text, name); return; }
    try {
      const d = JSON.parse(text);
      if (!d || !Array.isArray(d.slides) || !d.slides.length) throw new Error('からっぽ');
      state = d; state.cur = 0; selStamp = -1;
      save(); renderAll();
      document.getElementById('teacherModal').classList.remove('show');
      toast('「' + name + '」を ひらいたよ');
    } catch(e){ alert('この さくひんは ひらけませんでした (' + e.message + ')'); }
  }).withFailureHandler(gasFail).getWorkChunk(fileId, index, gasKey);
}
